[project]
name = "daily-brief-agent"
version = "0.1.0"
description = "Human-reviewed AI newspaper summarization agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "anyio>=4.15.1,<5",
  "fastapi>=0.142.2,<1",
  "google-genai>=1.0,<2",
  "jinja2>=3.1,<4",
  "openai>=1.55,<3",
  "pydantic>=2.9,<3",
  "pymupdf>=1.24,<2",
  "python-dotenv>=1.2.4,<2",
  "python-multipart>=0.0.32,<1",
  "requests>=2.34.2,<3",
  "starlette>=1.7,<2",
  "tzdata>=2025.2",
  "urllib3>=2.8,<3",
  "uvicorn[standard]>=0.30,<1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["app"]

[tool.setuptools.package-data]
app = ["templates/*.html", "static/*"]

[project.optional-dependencies]
dev = [
  "httpx2>=2.13,<3",
  "pytest>=9.0.3,<10",
  "ruff>=0.7,<1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.vercel]
entrypoint = "app.main:app"
